<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loxistica — No Connection</title>
  <style>
    :root { --primary: #005835; --bg: #f8faf9; --text: #0f1f17; --text2: #3d5c4a; --border: #d1ddd6; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); font-family: 'IBM Plex Sans', sans-serif; padding: 24px; }
    .card { text-align: center; max-width: 320px; width: 100%; }
    .icon { width: 72px; height: 72px; margin: 0 auto 20px; }
    .icon img { width: 100%; height: 100%; object-fit: contain; }
    h1 { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: var(--primary); letter-spacing: 0.08em; margin-bottom: 10px; }
    p { font-size: 13px; color: var(--text2); line-height: 1.7; margin-bottom: 24px; }
    button { background: var(--primary); color: #fff; border: none; border-radius: 3px; padding: 11px 28px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon"><img src="/icons/icon-128x128.png" alt="Loxistica" /></div>
    <h1>NO CONNECTION</h1>
    <p>You're offline. Please check your internet connection and try again.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
